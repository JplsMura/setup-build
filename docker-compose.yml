version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: setup_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - setup_network

  worker:
    build:
      context: ./docker/php
    container_name: setup_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
      - db
    networks:
      - setup_network

  web:
    image: nginx:alpine
    container_name: setup_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - setup_network

  frontend:
    build:
      context: ./docker/frontend
    container_name: setup_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - setup_network

  db:
    image: postgres:15-alpine
    container_name: setup_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-setup_db}
      POSTGRES_USER: ${DB_USERNAME:-setup_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - setup_network

  redis:
    image: redis:alpine
    container_name: setup_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - setup_network

networks:
  setup_network:
    driver: bridge

volumes:
  dbdata:
